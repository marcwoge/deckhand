# nfpm builds the .deb and the .rpm from this one file.
#   https://nfpm.goreleaser.com
#
# Two environment variables drive it, so one file covers every architecture:
#   VERSION  the package version, without the leading "v" (e.g. 0.1.1)
#   ARCH     amd64 | arm64 | arm
#
# The binary is taken from a fixed path rather than a versioned one, because nfpm
# expands environment variables in its own fields but not inside "contents".
# packaging/build-packages.sh stages the right binary there and loops:
#
#   ./packaging/build-packages.sh --tag v0.1.1
name: deckhand
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Marc-Philipp Woge <marc.woge@googlemail.com>
description: |
  Watch GitHub repositories, pull new revisions, run your command.
  Deckhand polls the repositories you name, checks out a new release or commit
  into its own directory, runs the command you configured and rolls back when
  the health check fails. It opens no listening port and needs no more than read
  access to the repositories it watches.
vendor: Marc-Philipp Woge
homepage: https://github.com/marcwoge/deckhand
license: Apache-2.0

contents:
  - src: build/deckhand
    dst: /usr/bin/deckhand
    file_info:
      mode: 0755

  # /usr/lib/systemd/system, not /etc: a unit or drop-in you write in /etc
  # overrides this one and survives every upgrade.
  - src: packaging/deckhand.service
    dst: /usr/lib/systemd/system/deckhand.service
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/deckhand/README.md
  - src: README.de.md
    dst: /usr/share/doc/deckhand/README.de.md
  - src: LICENSE
    dst: /usr/share/doc/deckhand/LICENSE
  - src: docs/en
    dst: /usr/share/doc/deckhand/en
  - src: docs/de
    dst: /usr/share/doc/deckhand/de
  - src: scripts/encrypt-credentials.sh
    dst: /usr/share/deckhand/scripts/encrypt-credentials.sh
    file_info:
      mode: 0755
  - src: scripts/install-release.sh
    dst: /usr/share/deckhand/scripts/install-release.sh
    file_info:
      mode: 0755

  # Created here so the directory exists with the right owner before anything is
  # written into it. The permissions are set again in postinstall, once the
  # deckhand user exists.
  - dst: /etc/deckhand
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

deb:
  # Nothing in /etc is shipped as a conffile: the configuration is written by the
  # operator, never by the package, so there is nothing for dpkg to prompt about.
  fields:
    Bugs: https://github.com/marcwoge/deckhand/issues
  # Signing is optional and off unless SIGNING_KEY_FILE points at an armoured
  # private key; an empty value means unsigned, which is what a local build
  # wants. The passphrase, if the key has one, comes from NFPM_PASSPHRASE.
  #
  # apt does not check this signature - it verifies the repository's Release file
  # instead - but dnf does check the rpm one, which is why the repository can be
  # served with gpgcheck=1.
  signature:
    key_file: ${SIGNING_KEY_FILE}
    type: origin

rpm:
  signature:
    key_file: ${SIGNING_KEY_FILE}

overrides:
  deb:
    depends:
      - git
      - adduser
  rpm:
    depends:
      - git
      - shadow-utils
