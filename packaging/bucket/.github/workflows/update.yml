# Rewrites the manifest when Deckhand publishes a release.
#
# The hashes come from the release's own SHA256SUMS, with cosign verifying the
# signature over that file first. No secret is needed: the repository's own
# GITHUB_TOKEN can push to the repository it belongs to.
name: Update the manifest

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to pin to (empty means the latest)'
        required: false

permissions:
  contents: write

jobs:
  update:
    name: Update the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marcwoge/deckhand
          path: .deckhand-src

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate the manifest from the signed release
        run: |
          args="--from-release --dist .out"
          if [ -n "${{ inputs.tag }}" ]; then
            args="$args --tag ${{ inputs.tag }}"
          fi
          ./.deckhand-src/packaging/generate-manifests.sh $args
          cp .out/deckhand.json bucket/deckhand.json

      - name: Commit if it changed
        run: |
          if git diff --quiet -- bucket/deckhand.json; then
            echo "the manifest is already current"
            exit 0
          fi
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' bucket/deckhand.json | head -1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/deckhand.json
          git commit -m "deckhand ${version}"
          git push
