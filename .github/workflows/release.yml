# Builds, signs and publishes the binaries for a tagged release.
# Runs only on version tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write        # keyless signing with cosign
  attestations: write    # build provenance

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.22'
          cache: true

      - name: Test before releasing
        run: go test ./...

      # Signing the packages and the repository needs a long-lived GPG key,
      # unlike the keyless cosign signature over the checksums. Everything below
      # degrades cleanly when the secret is absent: the packages are built
      # unsigned and the package repository is simply not published.
      - name: Prepare the package signing key
        id: key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${REPO_GPG_PRIVATE_KEY}" ]; then
            echo "no REPO_GPG_PRIVATE_KEY secret; packages stay unsigned and no"
            echo "apt/dnf repository is published (see packaging/README.md)"
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="${RUNNER_TEMP}/signing-key.asc"
          umask 077
          printf '%s' "${REPO_GPG_PRIVATE_KEY}" > "$key"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$key"
          id="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          # A key that cannot sign unattended would fail much later, in the
          # middle of publishing.
          echo probe | gpg --batch --yes --local-user "$id" --detach-sign -o /dev/null - ||
            { echo "::error::the signing key cannot sign unattended - export it without a passphrase"; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_FILE=$key" >> "$GITHUB_ENV"
          echo "REPO_KEY_ID=$id" >> "$GITHUB_ENV"
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "signing with $id"

      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            name="deckhand_${version}_${goos}_${goarch}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}${ext}" ./cmd/deckhand
            echo "built ${name}${ext}"
          done

      # nfpm turns the binaries into .deb and .rpm packages from one config.
      # Pinned, like every action here: a packaging tool runs over the same
      # artifacts the release is made of.
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0

      - name: Build packages
        run: |
          ./packaging/build-packages.sh --tag "${GITHUB_REF_NAME}"
          # Package versions carry no leading "v", so the release notes need it
          # separately to name the files.
          echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate the Homebrew formula and Scoop manifest
        run: ./packaging/generate-manifests.sh --tag "${GITHUB_REF_NAME}"

      # After the packages and manifests, so one signed file covers everything a
      # user can download - a tampered formula is caught by the same check as a
      # tampered binary.
      - name: Checksums over everything
        run: |
          cd dist && sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the signature is tied to this workflow's identity and
      # recorded in the public transparency log, so there is no key to leak.
      #
      # The signature and certificate go into one Sigstore bundle. cosign 3
      # ignores --output-signature and --output-certificate whenever the new
      # bundle format is in use, which it is by default - those flags would
      # produce no files at all while still exiting successfully.
      - name: Sign the checksum file
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS
          test -s dist/SHA256SUMS.bundle

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/deckhand*'

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        id: publish
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Installing

            **Debian, Ubuntu** — the package creates a `deckhand` service user,
            `/etc/deckhand/` and a hardened systemd unit, and leaves the service
            disabled until you have configured it:

            ```bash
            curl -fsSLO https://github.com/marcwoge/deckhand/releases/download/${{ github.ref_name }}/deckhand_${{ env.PKG_VERSION }}_amd64.deb
            sudo dpkg -i deckhand_*.deb            # or: sudo apt install ./deckhand_*.deb
            ```

            **Fedora, RHEL, openSUSE**:

            ```bash
            sudo rpm -i https://github.com/marcwoge/deckhand/releases/download/${{ github.ref_name }}/deckhand-${{ env.PKG_VERSION }}-1.x86_64.rpm
            ```

            **macOS** (there is no tap yet, so install the formula from its URL):

            ```bash
            brew install https://github.com/marcwoge/deckhand/releases/download/${{ github.ref_name }}/deckhand.rb
            ```

            **Windows** (no bucket yet either):

            ```powershell
            scoop install https://github.com/marcwoge/deckhand/releases/download/${{ github.ref_name }}/deckhand.json
            ```

            **Or just the binary** — download the one for your platform, put it
            somewhere on your `PATH`:

            ```bash
            deckhand init --config deckhand.yaml
            deckhand check      # validates the file
            deckhand doctor     # checks connectivity, credentials and permissions
            deckhand service install
            ```

            **Already running Deckhand?** `scripts/install-release.sh` updates it
            with the verification below done for you.

            ### Verifying this release

            Checksums:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            The checksum file is signed with [cosign](https://docs.sigstore.dev)
            in keyless mode — there is no private key, the signature is bound to
            this repository's release workflow and recorded in the public
            transparency log:

            ```bash
            cosign verify-blob SHA256SUMS \
              --bundle SHA256SUMS.bundle \
              --certificate-identity-regexp 'https://github.com/marcwoge/deckhand/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Each binary also carries [build provenance](https://github.com/marcwoge/deckhand/attestations):

            ```bash
            gh attestation verify deckhand_${{ github.ref_name }}_linux_amd64 --repo marcwoge/deckhand
            ```

            Updating an existing install, with all of the above done for you:

            ```bash
            sudo ./scripts/install-release.sh
            ```

            See the [README](https://github.com/marcwoge/deckhand#readme) ·
            [Deutsch](https://github.com/marcwoge/deckhand/blob/main/README.de.md)

      # --- the apt and dnf repository -------------------------------------
      # The repository is rebuilt from scratch and served by GitHub Pages. The
      # older packages come from the previous releases' own assets, so the
      # releases are the archive and this is only an index over them - nothing
      # accumulates in git history.
      - name: Collect the packages of recent releases
        if: steps.key.outputs.signing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./packaging/fetch-release-packages.sh --pool repo-pool --keep 5

      - name: Build the apt and dnf repository
        if: steps.key.outputs.signing == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c
          ./packaging/build-repo.sh \
            --pool repo-pool \
            --site site \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --key-id "$REPO_KEY_ID"

      - name: Upload the repository as a Pages artifact
        if: steps.key.outputs.signing == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  # A second job, because deploying to Pages needs permissions this one should
  # not have while it is building and signing artifacts.
  pages:
    name: Publish the package repository
    needs: build
    if: needs.build.outputs.signing == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # enablement turns Pages on with the Actions source the first time, so
      # nobody has to find the setting.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
