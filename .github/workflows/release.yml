# Builds, signs and publishes the binaries for a tagged release.
# Runs only on version tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write        # keyless signing with cosign
  attestations: write    # build provenance

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.22'
          cache: true

      - name: Test before releasing
        run: go test ./...

      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            name="deckhand_${version}_${goos}_${goarch}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}${ext}" ./cmd/deckhand
            echo "built ${name}${ext}"
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the signature is tied to this workflow's identity and
      # recorded in the public transparency log, so there is no key to leak.
      #
      # The signature and certificate go into one Sigstore bundle. cosign 3
      # ignores --output-signature and --output-certificate whenever the new
      # bundle format is in use, which it is by default - those flags would
      # produce no files at all while still exiting successfully.
      - name: Sign the checksum file
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS
          test -s dist/SHA256SUMS.bundle

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/deckhand_*'

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download the binary for your platform, put it somewhere on your `PATH`, and get going:

            ```bash
            deckhand init --config deckhand.yaml
            deckhand check      # validates the file
            deckhand doctor     # checks connectivity, credentials and permissions
            deckhand service install
            ```

            ### Verifying this release

            Checksums:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            The checksum file is signed with [cosign](https://docs.sigstore.dev)
            in keyless mode — there is no private key, the signature is bound to
            this repository's release workflow and recorded in the public
            transparency log:

            ```bash
            cosign verify-blob SHA256SUMS \
              --bundle SHA256SUMS.bundle \
              --certificate-identity-regexp 'https://github.com/marcwoge/deckhand/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Each binary also carries [build provenance](https://github.com/marcwoge/deckhand/attestations):

            ```bash
            gh attestation verify deckhand_linux_amd64 --repo marcwoge/deckhand
            ```

            See the [README](https://github.com/marcwoge/deckhand#readme) ·
            [Deutsch](https://github.com/marcwoge/deckhand/blob/main/README.de.md)
