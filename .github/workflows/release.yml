# Builds the binaries for a tagged release and attaches them, with checksums,
# to the GitHub release. Runs only on version tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Test before releasing
        run: go test ./...

      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            name="deckhand_${version}_${goos}_${goarch}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}${ext}" ./cmd/deckhand
            echo "built ${name}${ext}"
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download the binary for your platform, verify it against `SHA256SUMS`,
            and put it somewhere on your `PATH`.

            ```bash
            deckhand init --config deckhand.yaml
            deckhand check
            deckhand service install
            ```

            See the [README](https://github.com/marcwoge/deckhand#readme) ·
            [Deutsch](https://github.com/marcwoge/deckhand/blob/main/README.de.md)
